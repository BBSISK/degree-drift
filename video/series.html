<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--
  Degree Drift vertical subject series: 1080x1920, 17 s. Open as series.html?f=06 (field code).
  Every number on screen is read from series_data.js (CSO HEO08, honours grads of 2010–13);
  each hook also asserts the claim it makes, so a CSO revision that breaks a claim stops the render.
-->
<style>
  html, body { margin: 0; padding: 0; background: #070b18; }
  #stage { width: 1080px; height: 1920px; overflow: hidden; }
  svg text { font-family: 'Inter', 'Noto Color Emoji', sans-serif; }
</style>
<script src="series_data.js"></script>
</head>
<body>
<div id="stage"><svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
const F = new URLSearchParams(location.search).get('f') || '06';
const D = window.SD[F];
const END = 17.0, CX = 510;

const SECTOR = {
  J: 'Tech (ICT sector)', M: 'Professional & Scientific', G: 'Retail', Y0900: 'Industry & Manufacturing',
  Y3500: 'Finance & Real Estate', N: 'Admin & Support', I: 'Hospitality', F: 'Construction', P: 'Education',
  Q: 'Health & Social Work', O: 'Public Admin', Y7500: 'Other services', A: 'Agriculture', H: 'Transport',
};
const COLOR = {
  J: '#06b6d4', M: '#3b82f6', G: '#ec4899', Y0900: '#10b981', Y3500: '#8b5cf6', N: '#94a3b8', I: '#f472b6',
  F: '#f97316', P: '#f59e0b', Q: '#f43f5e', O: '#a3e635', Y7500: '#64748b', A: '#84cc16', H: '#14b8a6',
};
const share = (y, s) => D[String(y)].shares[s];
const top5 = y => Object.keys(D[String(y)].shares).sort((a, b) => share(y, b) - share(y, a)).slice(0, 5);
const pct = v => `${Math.round(v)}%`;
function claim(ok, msg) { if (!ok) throw new Error('Claim no longer true: ' + msg); }

// ---- per-subject hooks (numbers computed from the data; claims asserted) ----
const SUBJECTS = {
  '06': () => {
    const t1 = share(1, 'J'), t10 = share(10, 'J');
    claim(t1 < 50 && t10 < 50, 'under half of ICT grads in the ICT sector');
    return { name: 'ICT', ask: 'Studied ICT?', big: 'Over half', lines: [['of ICT grads'], ["DON'T work in ", 'TECH']],
      bar: 'J', barNote: 'work in the tech sector, Year 1', focus: 'J',
      p1: 'Year 10: still only', p2: `${pct(t10)} in the tech sector`, p3: 'The rest: consulting, finance, industry…' };
  },
  '04': () => {
    const g1 = share(1, 'G'), g10 = share(10, 'G'), j10 = share(10, 'J');
    claim(g1 >= 17.5 && g1 < 22.5, '~1 in 5 Business grads in retail in Year 1');
    claim(g10 < g1, 'retail share falls by Year 10');
    return { name: 'Business', ask: 'Studied Business?', big: '1 in 5', lines: [['Business grads started'], ['out in ', 'RETAIL']],
      bar: 'G', barNote: 'in their first year after college', focus: 'G',
      p1: 'By Year 10, retail is down to', p2: pct(g10), p3: `Tech up to ${pct(j10)}; finance ${pct(share(10, 'Y3500'))}` };
  },
  '07': () => {
    const f1 = share(1, 'F'), f10 = share(10, 'F');
    claim(f1 < 12.5 && f10 < 12.5, '~1 in 10 Engineering grads in construction');
    const lead = top5(10)[0];
    return { name: 'Engineering', ask: 'Studied Engineering?', big: '1 in 10', lines: [['engineering grads work'], ['in ', 'CONSTRUCTION']],
      bar: 'F', barNote: 'in their first year after college', focus: 'F',
      p1: "Year 10's #1 sector", p2: `${SECTOR[lead]} (${pct(share(10, lead))})`, p3: `Construction: still just ${pct(f10)}` };
  },
  '05': () => {
    claim(top5(1)[0] === 'G', "retail is Science grads' #1 sector in Year 1");
    claim(!top5(10).includes('G'), 'retail out of top 5 by Year 10');
    const lead = top5(10)[0];
    return { name: 'Science', ask: 'Studied Science?', big: 'Retail', lines: [["is science grads'"], ['#1 first sector']],
      bar: 'G', barNote: 'of science grads in retail, Year 1', focus: 'G',
      p1: "Year 10's #1 sector", p2: `${SECTOR[lead]} (${pct(share(10, lead))})`, p3: 'Retail: out of the top 5' };
  },
  '03': () => {
    const g1 = share(1, 'G');
    claim(g1 >= 22.5 && g1 < 27.5, '~1 in 4 Social Science grads in retail in Year 1');
    claim(!top5(10).includes('G'), 'retail out of top 5 by Year 10');
    const lead = top5(10)[0];
    return { name: 'Social Sciences', ask: 'Studied Social Science?', big: '1 in 4', lines: [['Social Science grads'], ['started in ', 'RETAIL']],
      bar: 'G', barNote: 'in their first year after college', focus: 'G',
      p1: "Year 10's #1 sector", p2: `${SECTOR[lead]} (${pct(share(10, lead))})`, p3: 'Retail: out of the top 5' };
  },
};
const S = SUBJECTS[F]();
const FIELD_LABEL = { '03': 'Social Sciences', '04': 'Business & Law', '05': 'Natural Sciences', '06': 'ICT', '07': 'Engineering, Manufacturing & Construction' }[F];
const SRC_SIZE = FIELD_LABEL.length > 30 ? 20 : 24;

// ---- helpers ----
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const inOut = (t, a, b, f = 0.3) => Math.min(ramp(t, a, a + f), 1 - ramp(t, b - f, b));
function el(tag, attrs, parent = svg, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e);
  return e;
}
// line = [plain, highlight?]
function line(parent, attrs, parts, hi = '#fbbf24') {
  const t = el('text', attrs, parent);
  el('tspan', {}, t, parts[0]);
  if (parts[1]) el('tspan', { fill: hi, 'font-weight': 900 }, t, parts[1]);
  return t;
}

function background() {
  el('rect', { x: 0, y: 0, width: 1080, height: 1920, fill: '#070b18' });
  const defs = el('defs', {});
  const rg = el('radialGradient', { id: 'g', cx: '50%', cy: '40%', r: '65%' }, defs);
  el('stop', { offset: '0%', 'stop-color': COLOR[S.focus], 'stop-opacity': 0.16 }, rg);
  el('stop', { offset: '100%', 'stop-color': '#070b18', 'stop-opacity': 0 }, rg);
  el('rect', { x: 0, y: 0, width: 1080, height: 1920, fill: 'url(#g)' });
  el('text', { x: CX, y: 290, 'text-anchor': 'middle', 'font-size': 32, 'font-weight': 800, fill: '#38bdf8', 'letter-spacing': 8 }, svg, 'DEGREE DRIFT');
  el('text', { x: CX, y: 1468, 'text-anchor': 'middle', 'font-size': SRC_SIZE, 'font-weight': 500, fill: '#64748b' }, svg,
    `Source: CSO Ireland, HEO08 • ${FIELD_LABEL} honours grads of 2010–13`);
  el('text', { x: CX, y: 1502, 'text-anchor': 'middle', 'font-size': 24, 'font-weight': 500, fill: '#64748b' }, svg,
    '© Government of Ireland, CC BY 4.0 • analysis: Degree Drift');
}

// ---- A: hook (0–3.2) ----
function hook(t) {
  const o = 1 - ramp(t, 3.0, 3.3);
  if (o <= 0) return;
  const g = el('g', { opacity: o });
  const pop = 1.1 - 0.1 * easeOut(ramp(t, 0, 0.5));
  el('text', { x: CX, y: 420, 'text-anchor': 'middle', 'font-size': 56, 'font-weight': 800, fill: '#e2e8f0' }, g, S.ask);
  const size = S.big.length > 8 ? 170 : 240;
  const big = el('g', { transform: `translate(${CX},690) scale(${pop})` }, g);
  el('text', { x: 0, y: 0, 'text-anchor': 'middle', 'font-size': size, 'font-weight': 900, fill: '#fff' }, big, S.big);
  line(g, { x: CX, y: 830, 'text-anchor': 'middle', 'font-size': 72, 'font-weight': 800, fill: '#fff' }, S.lines[0]);
  line(g, { x: CX, y: 920, 'text-anchor': 'middle', 'font-size': 72, 'font-weight': 800, fill: '#fff' }, S.lines[1]);
  const real = share(1, S.bar) / 100;
  const fill = lerp(real * 0.45, real, easeOut(ramp(t, 0, 1.1)));
  const bx = 110, bw = 800, by = 1030;
  el('rect', { x: bx, y: by, width: bw, height: 96, rx: 48, fill: 'rgba(30,41,59,0.9)' }, g);
  el('rect', { x: bx, y: by, width: Math.max(96, bw * fill), height: 96, rx: 48, fill: COLOR[S.bar] }, g);
  el('text', { x: bx + Math.max(96, bw * fill) + 24, y: by + 66, 'font-size': 52, 'font-weight': 900, fill: '#fbbf24' }, g, pct(share(1, S.bar)));
  el('text', { x: CX, y: 1200, 'text-anchor': 'middle', 'font-size': 40, 'font-weight': 600, fill: '#94a3b8' }, g, S.barNote);
}

// ---- B: bridge (3.2–4.7) ----
function bridge(t) {
  const o = inOut(t, 3.25, 4.75, 0.25);
  if (o <= 0) return;
  const g = el('g', { opacity: o, transform: `translate(0,${(1 - easeOut(ramp(t, 3.25, 3.7))) * 30})` });
  el('text', { x: CX, y: 760, 'text-anchor': 'middle', 'font-size': 96, 'font-weight': 900, fill: '#fff' }, g, 'Same graduates.');
  el('text', { x: CX, y: 880, 'text-anchor': 'middle', 'font-size': 96, 'font-weight': 900, fill: '#38bdf8' }, g, '10 years later…');
}

// ---- C: top-5 race (4.6–13.6) ----
const KEYS = [[4.6, 1], [5.4, 1], [6.1, 3], [6.6, 3], [7.3, 5], [7.8, 5], [8.6, 10], [END, 10]];
function stateAt(t) {
  for (let i = 0; i < KEYS.length - 1; i++) {
    const [t0, y0] = KEYS[i], [t1, y1] = KEYS[i + 1];
    if (t <= t1) return { a: y0, b: y1, k: y0 === y1 ? 0 : ease((t - t0) / (t1 - t0)) };
  }
  return { a: 10, b: 10, k: 0 };
}
const SHOWN = Array.from(new Set([1, 3, 5, 10].flatMap(top5)));
const MAXV = Math.max(...[1, 3, 5, 10].flatMap(y => top5(y).map(s => share(y, s))));
function race(t) {
  const o = Math.min(ramp(t, 4.55, 4.9), 1 - ramp(t, 13.4, 13.8));
  if (o <= 0) return;
  const g = el('g', { opacity: o });
  const { a, b, k } = stateAt(t);
  const yr = k < 0.5 ? a : b;
  const valOp = k === 0 ? 1 : Math.abs(1 - 2 * k) ** 3;
  const chip = el('g', { transform: `translate(${CX},400)` }, g);
  el('rect', { x: -230, y: -66, width: 460, height: 112, rx: 56, fill: 'rgba(15,23,42,0.92)', stroke: yr === 10 ? '#fbbf24' : '#38bdf8', 'stroke-width': 4 }, chip);
  el('text', { x: 0, y: 12, 'text-anchor': 'middle', 'font-size': 68, 'font-weight': 900, fill: '#fff' }, chip, `YEAR ${yr}`);
  el('text', { x: CX, y: 510, 'text-anchor': 'middle', 'font-size': 38, 'font-weight': 600, fill: '#94a3b8' }, g, `Top 5 sectors for ${S.name} grads`);

  const TA = top5(a), TB = top5(b);
  const rankOf = (T, s) => (T.includes(s) ? T.indexOf(s) : 5.6);
  const top = 580, rowH = 128, bx = 110, bw = 800;
  const payoff = ramp(t, 9.1, 9.6);
  SHOWN.forEach(s => {
    const r = lerp(rankOf(TA, s), rankOf(TB, s), k);
    const vis = clamp(5.4 - r); // fades as it drops below 5th
    if (vis <= 0.01) return;
    const v = lerp(share(a, s), share(b, s), k);
    const y = top + r * rowH;
    const w = Math.max(70, bw * v / MAXV);
    const dim = s === S.focus ? 1 : lerp(1, 0.55, payoff);
    const rg = el('g', { opacity: vis * dim }, g);
    el('text', { x: bx, y: y + 36, 'font-size': 38, 'font-weight': s === S.focus ? 900 : 700, fill: '#fff' }, rg, SECTOR[s]);
    el('rect', { x: bx, y: y + 52, width: w, height: 58, rx: 29, fill: COLOR[s] }, rg);
    const shown = D[String(yr)].shares[s];
    el('text', { x: bx + w + 18, y: y + 96, 'font-size': 44, 'font-weight': 900, fill: '#fbbf24', opacity: valOp }, rg, pct(shown));
  });
  if (payoff > 0) {
    const pg = el('g', { opacity: payoff, transform: `translate(0,${(1 - easeOut(payoff)) * 30})` }, g);
    el('rect', { x: 70, y: 1222, width: 880, height: 196, rx: 30, fill: 'rgba(15,23,42,0.95)', stroke: '#fbbf24', 'stroke-width': 3 }, pg);
    el('text', { x: CX, y: 1278, 'text-anchor': 'middle', 'font-size': 38, 'font-weight': 700, fill: '#fff' }, pg, S.p1);
    el('text', { x: CX, y: 1344, 'text-anchor': 'middle', 'font-size': S.p2.length > 24 ? 44 : 56, 'font-weight': 900, fill: '#fbbf24' }, pg, S.p2);
    el('text', { x: CX, y: 1396, 'text-anchor': 'middle', 'font-size': 34, 'font-weight': 600, fill: '#94a3b8' }, pg, S.p3);
  }
}

// ---- D: call to action (13.6–17) ----
function cta(t) {
  const o = ramp(t, 13.6, 14.0);
  if (o <= 0) return;
  const g = el('g', { opacity: o, transform: `translate(0,${(1 - easeOut(ramp(t, 13.6, 14.1))) * 30})` });
  el('text', { x: CX, y: 640, 'text-anchor': 'middle', 'font-size': 64, 'font-weight': 700, fill: '#cbd5e1' }, g, 'Your degree');
  el('text', { x: CX, y: 730, 'text-anchor': 'middle', 'font-size': 64, 'font-weight': 700, fill: '#cbd5e1' }, g, "doesn't pick your sector.");
  const k2 = easeOut(ramp(t, 14.4, 14.9));
  const g2 = el('g', { opacity: k2 }, g);
  el('text', { x: CX, y: 920, 'text-anchor': 'middle', 'font-size': 104, 'font-weight': 900, fill: '#fff' }, g2, 'What did');
  el('text', { x: CX, y: 1035, 'text-anchor': 'middle', 'font-size': 104, 'font-weight': 900, fill: '#fff' }, g2, 'you study?');
  const bob = Math.sin((t - 14.9) * 6) * 8;
  el('text', { x: CX, y: 1190 + bob * k2, 'text-anchor': 'middle', 'font-size': 52, 'font-weight': 800, fill: '#38bdf8' }, g2, 'Comment it 👇');
  el('text', { x: CX, y: 1270, 'text-anchor': 'middle', 'font-size': 44, 'font-weight': 600, fill: '#94a3b8' }, g2, "I'll show you where it leads");
}

window.render = function (t) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  background(); hook(t); bridge(t); race(t); cta(t);
};
window.render(0);
</script>
</body>
</html>
